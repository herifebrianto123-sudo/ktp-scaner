<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KTP MBG Scanner Pro</title>
    <meta name="description" content="Advanced KTP Scanner with Geotagging and Data Validation for Field Operations." />
    <meta property="og:title" content="KTP MBG Scanner Pro" />
    <meta property="og:description" content="Advanced KTP Scanner with Geotagging and Data Validation for Field Operations." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a'
              }
            }
          }
        }
      }
    </script>
    <script>
      // Suppress Vite HMR WebSocket connection warnings in iframe dev environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).toLowerCase().includes('websocket')) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
